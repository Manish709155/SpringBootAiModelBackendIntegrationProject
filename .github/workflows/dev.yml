name: Spring Ai Model Integration

on:
  push:
    branches:
      - develop
      

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Structure
        run: |
          pwd
          ls -R

      - name: Find Pom
        run: find . -name pom.xml
